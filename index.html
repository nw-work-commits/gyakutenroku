<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>三國志 逆天録</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="screen" width="640" height="480"></canvas>
      <div id="touch" hidden>
        <div class="dpad">
          <button data-key="up" aria-label="上">▲</button>
          <button data-key="left" aria-label="左">◀</button>
          <button data-key="down" aria-label="下">▼</button>
          <button data-key="right" aria-label="右">▶</button>
        </div>
        <div class="acts">
          <button data-key="cancel" aria-label="キャンセル">B</button>
          <button data-key="confirm" aria-label="決定">A</button>
        </div>
      </div>
      <p class="hint">
        移動: 方向キー / WASD　決定: Z・Enter・Space　キャンセル/メニュー: X・Esc
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
